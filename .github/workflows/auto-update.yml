name: Update Filters

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - '.devcontainer/**'
      - 'LICENSE'
      - 'rule/**'
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

concurrency:
  group: update-filters-main
  cancel-in-progress: false

jobs:
  update-filters:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Build filters
        run: |
          bash ./gradlew --no-daemon shadowJar
          mkdir -p logs
          java -jar "$(find build/libs -maxdepth 1 -name 'adfs-*-all.jar')" -c config/application.yaml

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: logs/*.log

      - name: Commit generated rules
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update filters'
          branch: ${{ github.event.repository.default_branch }}
          file_pattern: rule
